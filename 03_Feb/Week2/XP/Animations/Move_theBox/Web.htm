<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Move the Box</title>
    <style>
      #container {
        width: 400px;
        height: 400px;
        position: relative;
        background: yellow;
      }
      #animate {
        width: 50px;
        height: 50px;
        position: absolute;
        background-color: red;
        left: 0;
        top: 0;
      }
    </style>
  </head>

  <body>
    <p><button id="moveBtn">Click Me</button></p>
    <div id="container">
      <div id="animate"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
